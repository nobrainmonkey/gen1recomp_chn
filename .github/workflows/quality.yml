name: Source quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject ROMs, local extracts, and personal paths
        run: python tools/audit_public_tree.py
      - name: Check Python tools and manifest syntax
        run: |
          python -m py_compile tools/*.py mods/zh_cn/tools/*.py
          python -m json.tool mods/zh_cn/manifest.json > /dev/null
      - name: Verify generated Simplified-Chinese font
        run: python mods/zh_cn/tools/build_zh_cn_font.py --check
